name: Steam Achievement Build (Fixed)
on: [push, workflow_dispatch]

jobs:
  build-linux:
    name: Linux (Steam Deck)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Pre-install Git
        run: apt update && apt install -y git ca-certificates

      - name: Checkout mkxp-z
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Checkout Private Steam SDK
        uses: actions/checkout@v5
        with:
          repository: stesproject/steam-sdk
          token: ${{ secrets.SDK_TOKEN }}
          path: steam_sdk

      - name: Cache Linux Dependencies
        uses: actions/cache@v4
        with:
          path: |
            linux/build-x86_64
            linux/downloads
          key: lin-x86_64-${{ hashFiles('linux/Makefile') }}

      - name: Install apt dependencies
        run: |
          apt install git wget build-essential cmake meson autoconf automake libtool pkg-config ruby bison xxd zlib1g-dev libbz2-dev xorg-dev libgl1-mesa-dev libasound2-dev libpulse-dev patchelf -y

      - name: Build dependencies
        run: |
          cd linux
          make

      - name: Build and Manual Gather (Linux)
        shell: bash
        run: |
          source linux/vars.sh
          rm -rf build
          # Build only (avoiding the broken install script)
          meson setup build -Dsteamworks_path=$PWD/steam_sdk
          cd build
          ninja
          
          # Manually create the portable structure
          cd $GITHUB_WORKSPACE
          mkdir -p output/lib
          
          # Find the steam version of the binary and copy it
          cp build/steam_mkxp-z.x86_64 output/mkxp-z || cp build/mkxp-z output/mkxp-z
          
          # Copy Steam API and set the search path (RPATH)
          cp steam_sdk/redistributable_bin/linux64/libsteam_api.so output/lib/
          patchelf --set-rpath '$ORIGIN/lib' output/mkxp-z
          
          # Gather Ruby Standard Library
          cp -r linux/build-x86_64/lib/ruby/3.1.0 output/stdlib
          
          # Copy configuration
          [ -f mkxp.json ] && cp mkxp.json output/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z-linux-steamdeck
          path: output/

  build-windows:
    name: Windows (Intel x64)
    runs-on: windows-latest
    steps:
      - name: Checkout mkxp-z
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Checkout Private Steam SDK
        uses: actions/checkout@v5
        with:
          repository: stesproject/steam-sdk
          token: ${{ secrets.SDK_TOKEN }}
          path: steam_sdk

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            base-devel
            git
            ruby
            vim
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-libtool

      - name: Cache Windows Dependencies
        uses: actions/cache@v4
        with:
          path: |
            windows/build-mingw64
            windows/downloads
          key: win-${{ hashFiles('windows/Makefile') }}

      - name: Build dependencies
        shell: msys2 {0}
        run: |
          cd windows
          make

      - name: Build and Gather Windows Artifact
        shell: msys2 {0}
        run: |
          source windows/vars.sh
          rm -rf build 
          meson setup build -Dsteamworks_path=$PWD/steam_sdk
          cd build
          ninja
          
          # Create clean dist folder
          mkdir -p dist
          
          # Copy the EXE (We use the 'steam' prefixed one)
          cp steam_mkxp-z.exe dist/mkxp-z.exe || cp mkxp-z.exe dist/mkxp-z.exe
          strip dist/mkxp-z.exe
          
          # Copy DLLs with absolute safety paths
          cp ../steam_sdk/redistributable_bin/win64/steam_api64.dll dist/
          cp ../windows/build-mingw64/bin/x64-msvcrt-ruby310.dll dist/
          cp /mingw64/bin/zlib1.dll dist/
          
          # Copy Ruby Libs (Fixed Path)
          cp -r ../windows/build-mingw64/lib/ruby/3.1.0 dist/stdlib
          
          # Copy Config
          [ -f ../mkxp.json ] && cp ../mkxp.json dist/

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z-windows-intel
          path: build/dist/