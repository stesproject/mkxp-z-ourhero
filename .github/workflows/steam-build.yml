name: Steam Build

on:
  push:
    # Trigger only on these three specific branches
    branches:
      - 'oh-first'
      - 'oh-two'
      - 'oh-last'
    paths-ignore: ['*.md', '*.json', '*.png']

jobs:
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    # This automatically matches the branch name to the GitHub Environment name
    environment: ${{ github.ref_name }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout Private Steam SDK
        uses: actions/checkout@v5
        with:
          repository: stesproject/steam-sdk
          token: ${{ secrets.SDK_TOKEN }}
          path: steam_sdk

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            base-devel git ruby vim
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-expat

      - uses: actions/cache@v4
        with:
          path: |
            windows/build-mingw64
            windows/downloads
          key: win-${{ hashFiles('windows/Makefile') }}

      - name: Build all dependencies
        shell: msys2 {0}
        run: |
          cd windows
          make

      - name: Build exe
        shell: msys2 {0}
        run: |
          source windows/vars.sh
          rm -rf build
          meson setup build -Denable-https=false -Dsteamworks_path=$PWD/steam_sdk -Dsteam_appid=${{ vars.STEAM_APPID }}
          cd build
          ninja
          find . -maxdepth 1 -name "*.exe" -exec strip {} \;

      - name: Prepare archive
        shell: msys2 {0}
        run: |
          mkdir -p build/artifact
          cp -r build/* build/artifact/ 2>/dev/null || true
          cd build/artifact
          rm -rf build.ninja compile_commands.json meson-private meson-logs meson-info *.o *.a artifact
          cp ../../steam_sdk/redistributable_bin/win64/steam_api64.dll .
          cp ../../windows/build-mingw64/bin/x64-msvcrt-ruby310.dll .
          cp -r ../../windows/build-mingw64/lib/ruby/3.1.0 .
          mv ./3.1.0 ./stdlib
          cp /mingw64/bin/zlib1.dll .
          cp /mingw64/bin/SDL2.dll .
          cp /mingw64/bin/libpixman-1-0.dll .
          cp /mingw64/bin/libexpat-1.dll .
          cp -r ../../scripts .
          echo ${{ vars.STEAM_APPID }} > steam_appid.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.windows-${{ github.ref_name }}
          path: build/artifact

  build-linux-native:
    name: Linux Build
    runs-on: ubuntu-22.04
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout Private Steam SDK
        uses: actions/checkout@v5
        with:
          repository: stesproject/steam-sdk
          token: ${{ secrets.SDK_TOKEN }}
          path: steam_sdk

      - uses: actions/cache@v4
        with:
          path: |
            linux/build-x86_64
            linux/downloads
          key: lin-x86_64-${{ hashFiles('linux/Makefile') }}

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo apt install git wget build-essential cmake meson autoconf automake libtool pkg-config ruby bison xxd zlib1g-dev libbz2-dev xorg-dev libgl1-mesa-dev libasound2-dev libpulse-dev patchelf -y

      - name: Build everything else
        run: |
          cd linux
          rm -rf downloads/x86_64/dbus
          make

      - name: Build executable
        run: |
          source linux/vars.sh
          rm -rf build
          meson setup build --bindir=. --prefix=$GITHUB_WORKSPACE/build/local -Denable-https=false -Dsteamworks_path=$PWD/steam_sdk -Dsteam_appid=${{ vars.STEAM_APPID }}
          cd build
          ninja
          ninja install || true

      - name: Prepare archive
        run: |
          cd build/local
          rm -f build.ninja compile_commands.json *.o *.a
          cp ../../steam_sdk/redistributable_bin/linux64/libsteam_api.so .
          cp ../../linux/build-x86_64/lib/libruby.so.3.1.3 ./libruby.so.3.1
          chmod +x *
          for f in *; do
            if [ -f "$f" ] && [ -x "$f" ] && [[ "$f" != *.so* ]]; then
              patchelf --set-rpath '$ORIGIN' "$f" 2>/dev/null || true
            fi
          done
          mkdir -p stdlib
          cp -r ../../linux/build-x86_64/lib/ruby/3.1.0/* ./stdlib/
          cp -r ../../scripts .
          echo ${{ vars.STEAM_APPID }} > steam_appid.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.linux-${{ github.ref_name }}
          path: build/local