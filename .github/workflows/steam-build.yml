name: Steam Build

on:
  push:
    branches: ['dev', 'autobuild']
    paths-ignore: ['*.md', '*.json', '*.png']
  pull_request:
    branches: ['dev', 'autobuild']
    paths-ignore: ['*.md', '*.json', '*.png']

env:
  STEAM_APPID: 847560

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            base-devel
            git
            ruby
            vim
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-gcc

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout steam-sdk
        uses: actions/checkout@v5
        with:
          repository: stesproject/steam-sdk
          path: steam_sdk
          token: ${{ secrets.SDK_TOKEN }}

      - uses: actions/cache@v4
        with:
          path: |
            windows/build-mingw64
            windows/downloads
          key: win-${{ hashFiles('windows/Makefile') }}

      - name: Build all dependencies
        shell: msys2 {0}
        run: |
          cd windows
          make

      - name: Build exe
        shell: msys2 {0}
        run: |
          source windows/vars.sh
          meson setup build -Dsteamworks_path=$GITHUB_WORKSPACE/steam_sdk -Dsteam_appid=$STEAM_APPID -Denable-https=false
          cd build && ninja
          strip ./mkxp-z.exe

      - name: Prepare archive
        shell: msys2 {0}
        run: |
          mkdir -p build/artifact
          
          # 1. Copy EVERYTHING from the build folder (where the .exes are)
          # We use -n (no-clobber) or just cp to get all files
          cp build/*.exe build/artifact/ 2>/dev/null || true
          cp build/*.dll build/artifact/ 2>/dev/null || true
          
          cd build/artifact
          
          # 2. Copy the Steam API & Ruby DLL
          cp ../../steam_sdk/redistributable_bin/win64/steam_api64.dll .
          cp ../../windows/build-mingw64/bin/x64-msvcrt-ruby310.dll .
          
          # 3. Copy Ruby Environment
          cp -r ../../windows/build-mingw64/lib/ruby/3.1.0 .
          mv ./3.1.0 ./stdlib
          
          # 4. Copy MSYS2 Dependencies
          cp /mingw64/bin/zlib1.dll .
          cp /mingw64/bin/SDL2.dll .
          cp /mingw64/bin/libpixman-1-0.dll .
          cp /mingw64/bin/libexpat-1.dll .
          
          # 5. Assets
          cp ../../mkxp.json .
          cp -r ../../scripts .
          echo $STEAM_APPID > steam_appid.txt

          # 6. List Files to verify
          echo "--- WINDOWS COMPLETE ARTIFACT LIST ---"
          ls -Rlh

      - name: Check for DLLs missing from the artifact
        shell: msys2 {0}
        run: |
          cd build/artifact
          error_flag=

          for file in *.exe *.dll
          do
            ldd_output="$(ldd "$file")"
            echo "$file"
            echo "$ldd_output"

            while IFS= read -r line
            do
              dll_name="$(echo "$line" | sed -e 's/=>/|/g' | cut -d '|' -f 1 | sed -e 's/^[ \t]*//g' -e 's/[ \t]*$//g')"
              dll_location="$(echo "$line" | sed -e 's/=>/|/g' | cut -d '|' -f 2 | sed -e 's/^[ \t]*//g' -e 's/[ \t]*$//g')"
              if [[ "$dll_location" = 'not found'* ]] || [[ "$dll_location" = '/mingw64/bin/'* ]] || [[ "$dll_location" = '/mingw64/lib/'* ]] || [[ "$dll_location" = '/mingw64/usr/bin/'* ]] || [[ "$dll_location" = '/mingw64/usr/lib/'* ]]
              then
                error_flag=1
                echo "::error::$dll_name is missing from the artifact"
              fi
            done <<< "$ldd_output"
          done

          if [ -n "$error_flag" ]
          then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.windows.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: build/artifact

  build-linux-native:
    name: Ubuntu 22.04 x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 7

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout steam-sdk
        uses: actions/checkout@v5
        with:
          repository: stesproject/steam-sdk
          path: steam_sdk
          token: ${{ secrets.SDK_TOKEN }}

      - uses: actions/cache@v4
        with:
          path: |
            linux/build-x86_64
          key: lin-x86_64-${{ hashFiles('linux/Makefile') }}

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo apt install git wget build-essential cmake meson autoconf automake libtool pkg-config ruby bison xxd zlib1g-dev libbz2-dev xorg-dev libgl1-mesa-dev libasound2-dev libpulse-dev -y

      - name: Build everything else
        run: |
          cd linux
          make

      - name: Build executable
        run: |
          source linux/vars.sh
          meson setup build --bindir=. --prefix=$GITHUB_WORKSPACE/build/local \
            -Dsteamworks_path="$GITHUB_WORKSPACE/steam_sdk" \
            -Dsteam_appid=$STEAM_APPID \
            -Denable-https=false \
            -Dc_args='-Wl,-rpath=\$$ORIGIN'
          cd build
          ninja
          # Strip the executable - it might be named mkxp-z or steam_mkxp-z
          if [ -f ./mkxp-z ]; then
            strip ./mkxp-z
          elif [ -f ./steam_mkxp-z ]; then
            strip ./steam_mkxp-z
          fi

      - name: Prepare archive
        run: |
          mkdir -p build/local
          
          # 1. Copy EVERYTHING from the build folder
          # On Linux, these usually don't have extensions, so we grab all files
          find build -maxdepth 1 -type f -exec cp {} build/local/ \; 2>/dev/null || true
          
          cd build/local
          chmod +x *
          
          # 2. Steam API & RPath Fix for all binaries found
          cp ../../steam_sdk/redistributable_bin/linux64/libsteam_api.so .
          
          # Apply patchelf to every file that looks like an executable
          for f in *; do
            if [ -f "$f" ] && [ -x "$f" ]; then
              patchelf --set-rpath '$ORIGIN' "$f" 2>/dev/null || true
            fi
          done
          
          # 3. Assets
          mkdir -p stdlib
          cp -r ../../linux/build-x86_64/lib/ruby/3.1.0/* ./stdlib/
          cp ../../mkxp.json .
          cp -r ../../scripts .
          echo $STEAM_APPID > steam_appid.txt

          # 4. List Files to verify
          echo "--- LINUX COMPLETE ARTIFACT LIST ---"
          ls -Rlh

      - uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.linux.ubuntu.22.04.x86_64.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: build/local
