name: Steam Build

on:
  push:
    branches: ['dev', 'autobuild']
    paths-ignore: ['*.md', '*.json', '*.png']
  pull_request:
    branches: ['dev', 'autobuild']
    paths-ignore: ['*.md', '*.json', '*.png']

env:
  STEAM_APPID: 847560

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout Private Steam SDK
        uses: actions/checkout@v5
        with:
          repository: stesproject/steam-sdk
          token: ${{ secrets.SDK_TOKEN }}
          path: steam_sdk

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            base-devel git ruby vim
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-expat

      - uses: actions/cache@v4
        with:
          path: |
            windows/build-mingw64
            windows/downloads
          key: win-${{ hashFiles('windows/Makefile') }}

      - name: Build all dependencies
        shell: msys2 {0}
        run: |
          cd windows
          make

      - name: Build exe
        shell: msys2 {0}
        run: |
          source windows/vars.sh
          rm -rf build
          meson setup build -Denable-https=false -Dsteamworks_path=$PWD/steam_sdk -Dsteam_appid=$STEAM_APPID
          cd build
          ninja
          # Strip any .exe found in the build folder
          find . -maxdepth 1 -name "*.exe" -exec strip {} \;

      - name: Prepare archive
        shell: msys2 {0}
        run: |
          mkdir -p build/artifact
          
          # 1. Copy EVERY .exe and .dll produced in the build folder
          cp build/*.exe build/artifact/ 2>/dev/null || true
          cp build/*.dll build/artifact/ 2>/dev/null || true
          
          cd build/artifact
          
          # 2. Copy the Steam API & Ruby DLL
          cp ../../steam_sdk/redistributable_bin/win64/steam_api64.dll .
          cp ../../windows/build-mingw64/bin/x64-msvcrt-ruby310.dll .
          
          # 3. Copy Ruby Environment
          cp -r ../../windows/build-mingw64/lib/ruby/3.1.0 .
          mv ./3.1.0 ./stdlib
          
          # 4. Copy MSYS2 Dependencies (Now these exist because of the 'install' step above)
          cp /mingw64/bin/zlib1.dll .
          cp /mingw64/bin/SDL2.dll .
          cp /mingw64/bin/libpixman-1-0.dll .
          cp /mingw64/bin/libexpat-1.dll .
          
          # 5. Assets
          cp ../../mkxp.json .
          cp -r ../../scripts .
          echo $STEAM_APPID > steam_appid.txt

          # 6. List Files
          echo "--- WINDOWS COMPLETE ARTIFACT LIST ---"
          ls -Rlh

      - uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.windows
          path: build/artifact

  build-linux-native:
    name: Ubuntu 22.04 x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout Private Steam SDK
        uses: actions/checkout@v5
        with:
          repository: stesproject/steam-sdk
          token: ${{ secrets.SDK_TOKEN }}
          path: steam_sdk

      - uses: actions/cache@v4
        with:
          path: |
            linux/build-x86_64
            linux/downloads
          key: lin-x86_64-${{ hashFiles('linux/Makefile') }}

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo apt install git wget build-essential cmake meson autoconf automake libtool pkg-config ruby bison xxd zlib1g-dev libbz2-dev xorg-dev libgl1-mesa-dev libasound2-dev libpulse-dev patchelf -y

      - name: Build everything else
        run: |
          cd linux
          make

      - name: Build executable
        run: |
          source linux/vars.sh
          rm -rf build
          meson setup build --bindir=. --prefix=$GITHUB_WORKSPACE/build/local -Denable-https=false -Dsteamworks_path=$PWD/steam_sdk -Dsteam_appid=$STEAM_APPID
          cd build
          ninja
          ninja install || true

      - name: Prepare archive
        run: |
          mkdir -p build/local
          
          # 1. Copy ALL binaries produced in the build folder
          find build -maxdepth 1 -type f -not -name "*.o" -not -name "*.a" -exec cp {} build/local/ \; 2>/dev/null || true
          
          cd build/local
          chmod +x *
          
          # 2. Steam API & Ruby Shared Library
          cp ../../steam_sdk/redistributable_bin/linux64/libsteam_api.so .
          # ADDED: Copy libruby from your linux build folder to the root
          cp ../../linux/build-x86_64/lib/libruby.so.3.1.3 ./libruby.so.3.1
          
          # 3. RPath Fix for all binaries (so they find libsteam_api.so AND libruby.so.3.1 in root)
          for f in *; do
            if [ -f "$f" ] && [ -x "$f" ] && [[ "$f" != *.so* ]]; then
              patchelf --set-rpath '$ORIGIN' "$f" 2>/dev/null || true
            fi
          done
          
          # 4. Assets
          mkdir -p stdlib
          cp -r ../../linux/build-x86_64/lib/ruby/3.1.0/* ./stdlib/
          cp ../../mkxp.json .
          cp -r ../../scripts .
          echo $STEAM_APPID > steam_appid.txt

          # 5. List Files
          echo "--- LINUX COMPLETE ARTIFACT LIST ---"
          ls -Rlh

      - uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.linux.ubuntu
          path: build/local