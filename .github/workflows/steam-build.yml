name: Steam Achievement Build (Final Sync)
on: [push, workflow_dispatch]

jobs:
  build-linux:
    name: Linux (Steam Deck)
    runs-on: ubuntu-latest
    container: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - name: Pre-install Git
        run: apt update && apt install -y git ca-certificates

      - name: Checkout mkxp-z
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Checkout Private Steam SDK
        uses: actions/checkout@v5
        with:
          repository: stesproject/steam-sdk
          token: ${{ secrets.SDK_TOKEN }}
          path: steam_sdk

      - name: Cache Linux Dependencies
        uses: actions/cache@v4
        with:
          path: |
            linux/build-x86_64
            linux/downloads
          key: lin-debian-trixie-x86_64-${{ hashFiles('linux/Makefile') }}

      - name: Install apt dependencies
        run: |
          apt update
          apt install git wget build-essential cmake meson autoconf automake libtool pkg-config ruby bison xxd zlib1g-dev libbz2-dev xorg-dev libgl1-mesa-dev libasound2-dev libpulse-dev patchelf -y

      - name: Build dependencies
        run: |
          cd linux
          make

      - name: Build executable
        run: |
          source linux/vars.sh
          # Matches original: prefix points to build/local
          meson setup build --bindir=. --prefix=$GITHUB_WORKSPACE/build/local -Dsteamworks_path=$PWD/steam_sdk
          cd build
          # We run ninja but skip 'ninja install' if it keeps failing, 
          # or try it once more now that paths are identical to original.
          ninja
          ninja install || echo "Install script failed, continuing to manual prepare"

      - name: Prepare archive (Linux)
        run: |
          # If ninja install failed, ensure the directory exists
          mkdir -p build/local/lib64
          
          # Copy the Steam binary (overwriting the non-steam one if needed)
          cp build/steam_mkxp-z.x86_64 build/local/mkxp-z || cp build/mkxp-z build/local/mkxp-z
          
          # Copy Steam library into lib64 to match original structure
          cp steam_sdk/redistributable_bin/linux64/libsteam_api.so build/local/lib64/
          
          # Fix RPATH for the Steam library
          patchelf --set-rpath '$ORIGIN/lib64' build/local/mkxp-z || true
          
          cd build/local
          # Match original autobuild paths exactly
          cp -r ../../linux/build-x86_64/lib/ruby/3.1.0 .
          mv ./3.1.0 ./stdlib
          cp ../../mkxp.json . 2>/dev/null || true
          cp -r ../../scripts . 2>/dev/null || true
          # Grab other libs from linux/build if they exist (to fill lib64)
          cp ../../linux/build-x86_64/lib/*.so* ./lib64/ 2>/dev/null || true

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z-linux-steamdeck
          path: build/local

  build-windows:
    name: Windows (Intel x64)
    runs-on: windows-latest
    steps:
      - name: Checkout mkxp-z
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Checkout Private Steam SDK
        uses: actions/checkout@v5
        with:
          repository: stesproject/steam-sdk
          token: ${{ secrets.SDK_TOKEN }}
          path: steam_sdk

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            base-devel git ruby vim mingw-w64-x86_64-cmake mingw-w64-x86_64-meson
            mingw-w64-x86_64-gcc mingw-w64-x86_64-autotools mingw-w64-x86_64-libtool

      - name: Cache Windows Dependencies
        uses: actions/cache@v4
        with:
          path: |
            windows/build-mingw64
            windows/downloads
          key: win-${{ hashFiles('windows/Makefile') }}

      - name: Build dependencies
        shell: msys2 {0}
        run: |
          cd windows
          make

      - name: Build exe
        shell: msys2 {0}
        run: |
          source windows/vars.sh
          meson setup build -Dsteamworks_path=$PWD/steam_sdk
          cd build
          ninja
          strip ./mkxp-z.exe || strip ./steam_mkxp-z.exe

      - name: Prepare archive (Windows)
        shell: msys2 {0}
        run: |
          mkdir -p build/artifact
          cd build/artifact
          cp /mingw64/bin/zlib1.dll .
          cp ../../windows/build-mingw64/bin/x64-msvcrt-ruby310.dll .
          cp -r ../../windows/build-mingw64/lib/ruby/3.1.0 .
          mv ./3.1.0 ./stdlib
          # Copy Steam DLL
          cp ../../steam_sdk/redistributable_bin/win64/steam_api64.dll .
          # Copy EXE (handling potential steam_ prefix)
          cp ../steam_mkxp-z.exe ./mkxp-z.exe || cp ../mkxp-z.exe .
          cp ../../mkxp.json . 2>/dev/null || true
          cp -r ../../scripts . 2>/dev/null || true

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z-windows-intel
          path: build/artifact