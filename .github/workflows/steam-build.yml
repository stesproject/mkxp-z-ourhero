name: Steam Build

on:
  push:
    branches: ['dev', 'autobuild']
    paths-ignore: ['*.md', '*.json', '*.png']
  pull_request:
    branches: ['dev', 'autobuild']
    paths-ignore: ['*.md', '*.json', '*.png']

env:
  STEAM_APPID: 847560

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout Private Steam SDK
        uses: actions/checkout@v5
        with:
          repository: stesproject/steam-sdk
          token: ${{ secrets.SDK_TOKEN }}
          path: steam_sdk

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            base-devel git ruby mingw-w64-x86_64-cmake mingw-w64-x86_64-meson 
            mingw-w64-x86_64-autotools mingw-w64-x86_64-gcc

      - uses: actions/cache@v4
        with:
          path: |
            windows/build-mingw64
            windows/downloads
          key: win-${{ hashFiles('windows/Makefile') }}

      - name: Build all dependencies
        shell: msys2 {0}
        run: |
          cd windows
          make

      - name: Build exe
        shell: msys2 {0}
        run: |
          source windows/vars.sh
          meson setup build -Denable-https=false -Dsteamworks_path=$PWD/steam_sdk -Dsteam_appid=$STEAM_APPID
          cd build
          ninja
          strip ./mkxp-z.exe

      - name: Prepare archive
        shell: msys2 {0}
        run: |
          mkdir -p build/artifact
          cd build/artifact
          
          # Engine and Steam API
          cp ../../build/mkxp-z.exe .
          cp ../../steam_sdk/redistributable_bin/win64/steam_api64.dll .
          
          # Ruby Environment
          cp ../../windows/build-mingw64/bin/x64-msvcrt-ruby310.dll .
          cp -r ../../windows/build-mingw64/lib/ruby/3.1.0 .
          mv ./3.1.0 ./stdlib
          
          # Required System DLLs (Fixes the 7MB tiny build issue)
          cp /mingw64/bin/zlib1.dll .
          cp /mingw64/bin/SDL2.dll .
          cp /mingw64/bin/libpixman-1-0.dll .
          cp /mingw64/bin/libexpat-1.dll .
          
          # Assets
          cp ../../mkxp.json .
          cp -r ../../scripts .
          echo $STEAM_APPID > steam_appid.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.windows
          path: build/artifact

  build-linux-native:
    name: Ubuntu 22.04 x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout Private Steam SDK
        uses: actions/checkout@v5
        with:
          repository: stesproject/steam-sdk
          token: ${{ secrets.SDK_TOKEN }}
          path: steam_sdk

      - uses: actions/cache@v4
        with:
          path: |
            linux/build-x86_64
            linux/downloads
          key: lin-x86_64-${{ hashFiles('linux/Makefile') }}

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo apt install git wget build-essential cmake meson autoconf automake libtool pkg-config ruby bison xxd zlib1g-dev libbz2-dev xorg-dev libgl1-mesa-dev libasound2-dev libpulse-dev patchelf -y

      - name: Build everything else
        run: |
          cd linux
          # FIX: Clear the broken dbus download folder before starting
          rm -rf downloads/x86_64/dbus
          make

      - name: Build executable
        run: |
          source linux/vars.sh
          meson setup build --bindir=. --prefix=$GITHUB_WORKSPACE/build/local -Denable-https=false -Dsteamworks_path=$PWD/steam_sdk -Dsteam_appid=$STEAM_APPID
          cd build
          ninja
          ninja install || true

      - name: Prepare archive
        run: |
          cd build/local
          
          # Ensure binary is in the root and EXECUTABLE
          [ ! -f ./mkxp-z ] && cp ../build/mkxp-z . || true
          chmod +x ./mkxp-z
          
          # Steam API
          cp ../../steam_sdk/redistributable_bin/linux64/libsteam_api.so .
          
          # FIX: Tell the binary to look for libsteam_api.so in its own folder
          patchelf --set-rpath '$ORIGIN' ./mkxp-z
          
          # Assets
          mkdir -p stdlib
          cp -r ../../linux/build-x86_64/lib/ruby/3.1.0/* ./stdlib/
          cp ../../mkxp.json .
          cp -r ../../scripts .
          echo $STEAM_APPID > steam_appid.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.linux.ubuntu
          path: build/local