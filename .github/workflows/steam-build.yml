name: Steam Build

on:
  push:
    branches: ['dev', 'autobuild']
    paths-ignore: ['*.md', '*.json', '*.png']
  pull_request:
    branches: ['dev', 'autobuild']
    paths-ignore: ['*.md', '*.json', '*.png']

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    environment: oh-first
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout Private Steam SDK
        uses: actions/checkout@v5
        with:
          repository: stesproject/steam-sdk
          token: ${{ secrets.SDK_TOKEN }}
          path: steam_sdk

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            base-devel git ruby vim
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-expat

      - uses: actions/cache@v4
        with:
          path: |
            windows/build-mingw64
            windows/downloads
          key: win-${{ hashFiles('windows/Makefile') }}

      - name: Build all dependencies
        shell: msys2 {0}
        run: |
          cd windows
          make

      - name: Build exe
        shell: msys2 {0}
        run: |
          source windows/vars.sh
          rm -rf build
          meson setup build -Denable-https=false -Dsteamworks_path=$PWD/steam_sdk -Dsteam_appid=$STEAM_APPID
          cd build
          ninja
          [ -f ./mkxp-z.exe ] && strip ./mkxp-z.exe || true
          [ -f ./steam_mkxp-z.exe ] && strip ./steam_mkxp-z.exe || true

      - name: Prepare archive
        shell: msys2 {0}
        run: |
          mkdir -p build/artifact
          cd build/artifact
          
          # --- EXPLICIT WINDOWS FILES ---
          cp ../../build/mkxp-z.exe .
          cp ../../build/steam_mkxp-z.exe .
          cp ../../steam_sdk/redistributable_bin/win64/steam_api64.dll .
          cp ../../windows/build-mingw64/bin/x64-msvcrt-ruby310.dll .
          cp /mingw64/bin/zlib1.dll .
          echo $STEAM_APPID > steam_appid.txt
          
          # Ruby StdLib & Scripts
          cp -r ../../scripts .
          cp -r ../../windows/build-mingw64/lib/ruby/3.1.0 .
          mv ./3.1.0 ./stdlib

          echo "--- WINDOWS FILE LIST ---"
          ls -Rlh

      - uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.windows
          path: build/artifact

  build-linux-native:
    name: Ubuntu 22.04 x86_64
    runs-on: ubuntu-22.04
    environment: oh-first
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout Private Steam SDK
        uses: actions/checkout@v5
        with:
          repository: stesproject/steam-sdk
          token: ${{ secrets.SDK_TOKEN }}
          path: steam_sdk

      - uses: actions/cache@v4
        with:
          path: |
            linux/build-x86_64
            linux/downloads
          key: lin-x86_64-${{ hashFiles('linux/Makefile') }}

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo apt install git wget build-essential cmake meson autoconf automake libtool pkg-config ruby bison xxd zlib1g-dev libbz2-dev xorg-dev libgl1-mesa-dev libasound2-dev libpulse-dev patchelf -y

      - name: Build everything else
        run: |
          cd linux
          rm -rf downloads/x86_64/dbus
          make

      - name: Build executable
        run: |
          source linux/vars.sh
          rm -rf build
          meson setup build --bindir=. --prefix=$GITHUB_WORKSPACE/build/local -Denable-https=false -Dsteamworks_path=$PWD/steam_sdk -Dsteam_appid=$STEAM_APPID
          cd build
          ninja
          ninja install || true

      - name: Prepare archive
        run: |
          mkdir -p build/local
          cd build/local
          
          # --- EXPLICIT LINUX FILES ---
          cp ../build/mkxp-z .
          cp ../build/steam_mkxp-z* . 2>/dev/null || true
          cp ../../steam_sdk/redistributable_bin/linux64/libsteam_api.so .
          cp ../../linux/build-x86_64/lib/libruby.so.3.1.3 ./libruby.so.3.1
          echo $STEAM_APPID > steam_appid.txt
          
          # Fix Permissions & RPath
          chmod +x ./mkxp-z ./steam*
          patchelf --set-rpath '$ORIGIN' ./mkxp-z
          patchelf --set-rpath '$ORIGIN' ./steam* 2>/dev/null || true
          
          # Assets
          mkdir -p stdlib
          cp -r ../../linux/build-x86_64/lib/ruby/3.1.0/* ./stdlib/
          cp -r ../../scripts .

          echo "--- LINUX FILE LIST ---"
          ls -Rlh

      - uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.linux.ubuntu
          path: build/local
